[project]
name = "mold-agent"
version = "0.1.0"
description = "冲压模具前期评估辅助 Agent 系统 (MVP)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
# 真实模型接入(自托管 Qwen/DeepSeek 等 OpenAI 兼容端点);离线 ScriptedLLM 不需要
llm = ["openai>=1.40"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mold_agent"]
