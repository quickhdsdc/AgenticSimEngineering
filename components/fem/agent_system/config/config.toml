# LLM 配置 —— 多 profile(对齐 EmbodiedTwin backend 约定)。无任何离线/仿真档,全部为真实端点。
#   [llm]           = 默认档(不指定 profile 时用)
#   [llm.<name>]    = 具名档;继承 [llm] 的默认值并覆盖
# 选择: 环境变量 MOLD_LLM_PROFILE=deepseek(默认用 [llm])。
# 自托管 vLLM(Qwen)另见 config/config.vllm.toml,用 MOLD_CONFIG 指向它。
# api_type: "openai"(任意 OpenAI 兼容端点) | "azure"。
# 安全: 密钥可写 "env:VAR" 从环境变量取,避免入库。

[llm]  # 默认:Azure OpenAI
api_type = "azure"
model = "gpt-5-2025-08-07"
base_url = "https://fhgenie-api-ipa-genai4aas.openai.azure.com"
api_key = ""
api_version = "2024-10-21"
temperature = 0.0
max_tokens = 8192

[llm.embedding]  # 向量模型(非对话;供检索/RAG 用)
api_type = "azure"
model = "text-embedding-3-large-1"
base_url = "https://fhgenie-api-ipa-genai4aas.openai.azure.com"
api_key = ""
api_version = "2024-10-21"
temperature = 0.0
max_tokens = 8192

[llm.deepseek]
api_type = "openai"
model = "deepseek-reasoner"
base_url = "https://api.deepseek.com"
api_key = ""
temperature = 0.0
max_tokens = 4096
